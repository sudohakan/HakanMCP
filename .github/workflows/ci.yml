name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.build.json --noEmit

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run smoke tests
        run: npm run test:smoke -- --forceExit
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'
      - name: Run full test suite
        # TODO: Fix 135 test failures then remove continue-on-error
        continue-on-error: true
        run: npm test -- --forceExit
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify build output
        run: |
          test -f dist/src/index.js || exit 1
          test -f dist/tool-manifest.json || exit 1
        shell: bash

  build-macos:
    name: Build (macos-latest)
    runs-on: macos-latest
    # Hosted macOS capacity can leave the job queued ~15 min until GitHub cancels it (the timeout
    # below counts only from job start). The gate fails on a real macOS failure, not on cancelled.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify build output
        run: |
          test -f dist/src/index.js || exit 1
          test -f dist/tool-manifest.json || exit 1
        shell: bash

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit (high + critical only)
        run: npm audit --audit-level=high

  pack:
    name: Package Dry Run
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tail -20
          FILE_COUNT=$(npm pack --dry-run 2>&1 | grep "total files" | grep -oP '\d+' || echo "0")
          echo "Package files: $FILE_COUNT"
          if [ "$FILE_COUNT" -gt 600 ]; then
            echo "::warning::Package has $FILE_COUNT files — consider trimming"
          fi

  gate:
    name: Pipeline Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, build-macos, security, pack]
    if: always()
    steps:
      - name: Evaluate pipeline
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          BUILD_MACOS: ${{ needs.build-macos.result }}
          SECURITY: ${{ needs.security.result }}
          PACK: ${{ needs.pack.result }}
        run: |
          echo "Lint:      $LINT"
          echo "Typecheck: $TYPECHECK"
          echo "Test:      $TEST"
          echo "Build:     $BUILD"
          echo "Build mac: $BUILD_MACOS"
          echo "Security:  $SECURITY"
          echo "Pack:      $PACK"

          FAILED=0
          if [ "$LINT" != "success" ]; then echo "::error::Lint failed"; FAILED=1; fi
          if [ "$TYPECHECK" != "success" ]; then echo "::error::Type check failed"; FAILED=1; fi
          if [ "$BUILD" != "success" ]; then echo "::error::Build failed"; FAILED=1; fi
          if [ "$BUILD_MACOS" = "failure" ]; then echo "::error::macOS build failed"; FAILED=1; fi
          if [ "$BUILD_MACOS" = "cancelled" ]; then echo "::warning::macOS build cancelled (runner capacity), not a build failure"; fi

          if [ "$TEST" = "failure" ]; then echo "::warning::Tests failed"; fi
          if [ "$SECURITY" = "failure" ]; then echo "::warning::Security audit found vulnerabilities"; fi

          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "Pipeline gate passed"
