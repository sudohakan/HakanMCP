name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.build.json --noEmit

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --forceExit
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test — MCP server starts
        run: node dist/src/index.js &
        shell: bash
        timeout-minutes: 1
        continue-on-error: true
      - name: Smoke test — CLI version
        run: node dist/bin/cli.js --version
        shell: bash

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit (high + critical only)
        run: npm audit --audit-level=high

  pack:
    name: Package Dry Run
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tail -20
          SIZE=$(npm pack --dry-run 2>&1 | grep "total files" || echo "unknown")
          echo "Package: $SIZE"

  gate:
    name: Pipeline Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, security, pack]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Lint:      ${{ needs.lint.result }}"
          echo "Typecheck: ${{ needs.typecheck.result }}"
          echo "Test:      ${{ needs.test.result }}"
          echo "Build:     ${{ needs.build.result }}"
          echo "Security:  ${{ needs.security.result }}"
          echo "Pack:      ${{ needs.pack.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Required checks failed"
            exit 1
          fi

          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "::warning::Tests failed — investigate before merging"
          fi

          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "::warning::Security audit found high/critical vulnerabilities"
          fi

          echo "Pipeline gate passed"
